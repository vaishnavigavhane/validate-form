<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JS - Form Validation</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
 
</head>

<body>

  <div class="container d-flex align-items-center justify-content-center">
    <div class="row contact-wrapper g-0">

      <!-- Left Side -->
      <div class="col-md-5 contact-left d-flex flex-column justify-content-center">
        <div class="icon-box">
          <i class="bi bi-chat-dots"></i>
        </div>
        <h2>Let's Connect</h2>
        <p class="mt-3">We would love to hear from you. Fill out the form and our team will get back to you shortly.</p>
      </div>

      <!-- Right Side Form -->
      <div class="col-md-7 contact-right">
        <form>

          <div class="row g-3">
            <div class="col-md-6">
              <div class="form-floating">
                <input type="text" class="form-control" id="name" placeholder="Full Name"  onkeyup="validateName()">
                <label for="name"><i class="bi bi-person me-2"></i>Full Name</label>
                <span id="nameError" class="p-1 text-danger"></span>
              </div>
            </div>

            <div class="col-md-6">
              <div class="form-floating">
                <input type="tel" class="form-control" id="phone" placeholder="Phone" onkeyup="validatePhone()">
                <label for="phone"><i class="bi bi-telephone me-2"></i>Phone Number</label>
                <span id="phoneError" class="p-1 text-danger right-0"></span>
              </div>
            </div>

            <div class="col-12">
              <div class="form-floating">
                <input type="email" class="form-control" id="email" placeholder="Email" onkeyup="validateEmail()">
                <label for="email"><i class="bi bi-envelope me-2"></i>Email Address</label>
                <span id="emailError" class="p-1 text-danger"></span>
              </div>
            </div>

            <div class="col-12">
              <div class="form-floating">
                <textarea class="form-control" placeholder="Message" id="message" style="height: 120px" onkeyup="validateMsg()"></textarea>
                <label for="message"><i class="bi bi-pencil-square me-2"></i>Message</label>
                <span id="messageError" class="p-1 text-danger"></span>
              </div>
            </div>

            <div class="col-12 mt-2">
             <span id="submitError" class="p-1 text-danger"></span>
              <button type="submit" id="submit" class="btn btn-custom w-100 text-white mt-2">Send Message</button>
            </div>
          </div>

        </form>
      </div>

    </div>
  </div>
<script src="./index.js"></script>
</body>
</html>
